{% extends 'marketplace/base.html' %}
{% block title %}My profile | ServiGo{% endblock %}
{% block content %}
<div class="container container-wide form-page"><a href="{% url 'dashboard' %}" class="back-link"><i class="fa-solid fa-arrow-left me-2"></i>Back to dashboard</a><div class="row justify-content-center"><div class="col-lg-7"><div class="form-shell"><span class="section-kicker">YOUR ACCOUNT</span><div class="profile-header"><span class="avatar profile-avatar">{{ user.username|first|upper }}</span><div><h1>My profile</h1><p class="form-subtitle mb-0">Personal details and contact information</p></div></div><form method="post">{% csrf_token %}<div class="row"><div class="col-md-6 form-field"><label class="form-label" for="first_name">First name</label><input id="first_name" type="text" name="first_name" class="form-control" value="{{ user.first_name }}"></div><div class="col-md-6 form-field"><label class="form-label" for="last_name">Last name</label><input id="last_name" type="text" name="last_name" class="form-control" value="{{ user.last_name }}"></div></div><div class="form-field"><label class="form-label" for="email">Email address</label><input id="email" type="email" name="email" class="form-control" value="{{ user.email }}"></div><div class="form-field"><label class="form-label" for="phone">Phone number</label><input id="phone" type="tel" name="phone_number" class="form-control" value="{{ profile.phone_number }}"></div><div class="form-field"><label class="form-label" for="address">Address</label><textarea id="address" name="address" class="form-control" rows="3">{{ profile.address }}</textarea></div><button class="btn btn-primary btn-lg" type="submit"><i class="fa-solid fa-check me-2"></i>Save profile</button></form></div></div></div></div>
{% endblock %}
