{% if page_obj.paginator.num_pages > 1 %}
<nav class="staff-pages" aria-label="Pagination">
 <span>Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} • {{ page_obj.paginator.count }} records</span>
 <div class="d-flex gap-2">
  {% if page_obj.has_previous %}<a class="btn btn-outline-primary btn-sm" href="?q={{ query|urlencode }}&status={{ status_filter|default:''|urlencode }}&role={{ role_filter|default:''|urlencode }}&state={{ state_filter|default:''|urlencode }}&page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
  {% if page_obj.has_next %}<a class="btn btn-outline-primary btn-sm" href="?q={{ query|urlencode }}&status={{ status_filter|default:''|urlencode }}&role={{ role_filter|default:''|urlencode }}&state={{ state_filter|default:''|urlencode }}&page={{ page_obj.next_page_number }}">Next</a>{% endif %}
 </div>
</nav>
{% endif %}
